name: Build WinUI3 UI Prototype

on:
  workflow_dispatch:
  push:
    branches: [ winui3-ui-prototype ]
    paths:
      - 'winui3-prototype/**'
      - '.github/workflows/build-winui3-prototype.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Reconstruct prototype source
        shell: pwsh
        run: |
          $b64 = Get-Content .\winui3-prototype\source.b64 -Raw
          [IO.File]::WriteAllBytes('.\prototype-source.zip', [Convert]::FromBase64String(($b64 -replace '\s','')))
          Expand-Archive .\prototype-source.zip .\prototype-src -Force
          Copy-Item .\winui3-prototype\GenshinSwitcherWinUI3Prototype.override.vcxproj .\prototype-src\GenshinSwitcherWinUI3Prototype.vcxproj -Force
          Copy-Item .\winui3-prototype\main.override.cpp .\prototype-src\main.cpp -Force

          # A code-only WinUI 3 C++ app still needs a XAML metadata provider so the framework
          # can resolve control styles and types without App.xaml/generated metadata.
          $mainPath = '.\prototype-src\main.cpp'
          $code = Get-Content $mainPath -Raw
          $code = $code.Replace('#include <winrt/Microsoft.UI.Xaml.Media.Animation.h>', '#include <winrt/Microsoft.UI.Xaml.Media.Animation.h>' + "`r`n" + '#include <winrt/Microsoft.UI.Xaml.XamlTypeInfo.h>')
          $code = $code.Replace('#include <winrt/Windows.UI.h>', '#include <winrt/Windows.UI.h>' + "`r`n" + '#include <winrt/Windows.UI.Xaml.Interop.h>')
          $code = $code.Replace('using namespace Microsoft::UI::Xaml::Shapes;', 'using namespace Microsoft::UI::Xaml::Shapes;' + "`r`n" + 'using namespace Microsoft::UI::Xaml::Markup;' + "`r`n" + 'using namespace Microsoft::UI::Xaml::XamlTypeInfo;' + "`r`n" + 'using namespace Windows::UI::Xaml::Interop;')
          $code = $code.Replace('class PrototypeApp : public ApplicationT<PrototypeApp>', 'class PrototypeApp : public ApplicationT<PrototypeApp, IXamlMetadataProvider>')
          $code = [regex]::Replace($code, '(?s)\s*PrototypeApp\(\)\s*\{\s*ResourceDictionary resources;\s*resources\.MergedDictionaries\(\)\.Append\(XamlControlsResources\(\)\);\s*Resources\(resources\);\s*\}\s*', "`r`n")
          $code = $code.Replace('void OnLaunched(LaunchActivatedEventArgs const&)' + "`r`n" + '        {' + "`r`n" + '            m_window = Window();', 'void OnLaunched(LaunchActivatedEventArgs const&)' + "`r`n" + '        {' + "`r`n" + '            Resources().MergedDictionaries().Append(XamlControlsResources());' + "`r`n`r`n" + '            m_window = Window();')
          $metadataMethods = @'
        IXamlType GetXamlType(TypeName const& type)
        {
            return m_xamlProvider.GetXamlType(type);
        }

        IXamlType GetXamlType(hstring const& fullname)
        {
            return m_xamlProvider.GetXamlType(fullname);
        }

        com_array<XmlnsDefinition> GetXmlnsDefinitions()
        {
            return m_xamlProvider.GetXmlnsDefinitions();
        }

    private:
'@
          $code = $code.Replace('    private:' + "`r`n" + '        UIElement BuildRoot()', $metadataMethods + '        UIElement BuildRoot()')
          $code = $code.Replace('        Window m_window{ nullptr };', '        XamlControlsXamlMetaDataProvider m_xamlProvider;' + "`r`n" + '        Window m_window{ nullptr };')
          [IO.File]::WriteAllText((Resolve-Path $mainPath), $code, [Text.UTF8Encoding]::new($false))
          Get-ChildItem .\prototype-src | Format-Table Name,Length
          Select-String -Path $mainPath -Pattern 'IXamlMetadataProvider|XamlControlsXamlMetaDataProvider|MergedDictionaries'

      - name: Restore native Windows App SDK build packages
        shell: pwsh
        working-directory: .\prototype-src
        run: |
          nuget install Microsoft.WindowsAppSDK -Version 1.8.260710003 -OutputDirectory .\packages -DependencyVersion Highest -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget install Microsoft.Windows.CppWinRT -Version 3.0.260715.1 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.8249 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem .\packages -Directory | Select-Object Name | Sort-Object Name | Format-Table

      - name: Build x64 Release
        shell: pwsh
        working-directory: .\prototype-src
        run: |
          msbuild .\GenshinSwitcherWinUI3Prototype.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show output size
        shell: pwsh
        run: |
          Get-ChildItem .\prototype-src\dist | Sort-Object Length -Descending | Format-Table Name,Length
          $total = (Get-ChildItem .\prototype-src\dist -File | Measure-Object Length -Sum).Sum
          Write-Host "Total output bytes: $total"

      - name: Install Windows App Runtime 1.8 for launch test
        shell: pwsh
        run: |
          $url = 'https://download.microsoft.com/download/712421b4-6f72-47fc-acb8-2ebf030b2260/WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest $url -OutFile .\WindowsAppRuntimeInstall-x64.exe
          $p = Start-Process .\WindowsAppRuntimeInstall-x64.exe -ArgumentList '--quiet' -Wait -PassThru
          Write-Host "Runtime installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Runtime installer failed with exit code $($p.ExitCode)" }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path .\prototype-src\dist\GenshinSwitcher-WinUI3-Prototype.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
            Write-Host "Prototype exited early. ExitCode=$($p.ExitCode)"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('.NET Runtime','Application Error','Windows Error Reporting') } |
              Select-Object -First 10 TimeCreated,ProviderName,Id,Message |
              Format-List | Out-String -Width 240 | Write-Host
            exit 1
          }
          Write-Host 'Prototype remained alive for 6 seconds.'
          Stop-Process -Id $p.Id -Force

      - name: Package prototype
        shell: pwsh
        run: |
          Copy-Item .\prototype-src\README.txt .\prototype-src\dist\README.txt -Force
          $hash = (Get-FileHash .\prototype-src\dist\GenshinSwitcher-WinUI3-Prototype.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GenshinSwitcher-WinUI3-Prototype.exe" | Set-Content -Encoding ascii .\prototype-src\dist\GenshinSwitcher-WinUI3-Prototype.exe.sha256
          Compress-Archive -Path .\prototype-src\dist\* -DestinationPath .\GenshinSwitcher-WinUI3-Prototype-x64.zip -Force
          Get-Item .\GenshinSwitcher-WinUI3-Prototype-x64.zip | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinSwitcher-WinUI3-Prototype-x64
          path: .\GenshinSwitcher-WinUI3-Prototype-x64.zip
          retention-days: 14
          if-no-files-found: error
