name: Publish v1.0.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore native packages
        shell: pwsh
        working-directory: .\native-winui3\src
        run: |
          nuget install Microsoft.WindowsAppSDK -Version 1.7.260224002 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget install Microsoft.Windows.CppWinRT -Version 3.0.260715.1 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.8249 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x64 Release
        shell: pwsh
        working-directory: .\native-winui3\src
        run: |
          msbuild .\GenshinAccountSwitcherNative.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $dist = '.\native-winui3\src\dist'
          Remove-Item "$dist\*.lib", "$dist\*.exp" -ErrorAction SilentlyContinue
          if (!(Test-Path "$dist\GenshinAccountSwitcher.exe")) { throw 'EXE missing' }
          if (!(Test-Path "$dist\resources.pri")) { throw 'resources.pri missing' }
          $hash = (Get-FileHash "$dist\GenshinAccountSwitcher.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GenshinAccountSwitcher.exe" | Set-Content -Encoding ascii "$dist\GenshinAccountSwitcher.exe.sha256"
          Compress-Archive -Path "$dist\*" -DestinationPath .\GenshinAccountSwitcher-Windows-x64.zip -Force
          $zipHash = (Get-FileHash .\GenshinAccountSwitcher-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  GenshinAccountSwitcher-Windows-x64.zip" | Set-Content -Encoding ascii .\GenshinAccountSwitcher-Windows-x64.zip.sha256

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release v1.0.1 already exists; skipping creation.'
            exit 0
          }
          gh release create v1.0.1 `
            .\GenshinAccountSwitcher-Windows-x64.zip `
            .\GenshinAccountSwitcher-Windows-x64.zip.sha256 `
            --target "$env:GITHUB_SHA" `
            --title "原神账号管理 v1.0.1" `
            --notes "v1.0.1 修复已保存账号列表在刷新或重建后 UID 横向位置发生变化的问题。`n`n- UID 与当前账号状态区域改为固定布局槽位`n- 移除仅在首次启动时生效的账号行占位补丁`n- 账号保存、账号切换、注册表读写、DPAPI 加密与进程检测逻辑保持不变`n`n下载 Windows x64 压缩包后直接解压运行。"
