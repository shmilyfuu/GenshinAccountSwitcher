name: Build WinUI3 XAML Prototype

on:
  workflow_dispatch:
  push:
    branches: [ winui3-ui-prototype ]
    paths:
      - 'winui3-xaml-prototype/**'
      - '.github/workflows/build-winui3-xaml-prototype.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Reconstruct official-baseline source
        shell: pwsh
        run: |
          $b64 = Get-Content .\winui3-xaml-prototype\source-v3.b64 -Raw
          [IO.File]::WriteAllBytes('.\xaml-source.zip', [Convert]::FromBase64String(($b64 -replace '\s','')))
          Expand-Archive .\xaml-source.zip .\xaml-src -Force
          Copy-Item .\winui3-xaml-prototype\GenshinSwitcherXamlPrototype.1.7.official.vcxproj .\xaml-src\GenshinSwitcherXamlPrototype.vcxproj -Force
          Copy-Item .\winui3-xaml-prototype\App.1.7.xaml .\xaml-src\App.xaml -Force
          Copy-Item .\winui3-xaml-prototype\MainWindow.1.7.xaml .\xaml-src\MainWindow.xaml -Force
          Copy-Item .\winui3-xaml-prototype\MainWindow.1.7.xaml.h .\xaml-src\MainWindow.xaml.h -Force
          Copy-Item .\winui3-xaml-prototype\MainWindow.1.7.xaml.cpp .\xaml-src\MainWindow.xaml.cpp -Force
          Select-String -Path .\xaml-src\GenshinSwitcherXamlPrototype.vcxproj -Pattern 'WindowsAppSDK.1.7|EnableMsixTooling|WindowsAppSDKSelfContained|AppxPriInitialPath|PRIResource'

      - name: Restore native packages
        shell: pwsh
        working-directory: .\xaml-src
        run: |
          nuget install Microsoft.WindowsAppSDK -Version 1.7.260224002 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget install Microsoft.Windows.CppWinRT -Version 3.0.260715.1 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.8249 -OutputDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x64 Release
        shell: pwsh
        working-directory: .\xaml-src
        run: |
          msbuild .\GenshinSwitcherXamlPrototype.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect output
        shell: pwsh
        run: |
          Get-ChildItem .\xaml-src\dist -File | Sort-Object Length -Descending | Format-Table Name,Length
          if (!(Test-Path .\xaml-src\dist\GenshinSwitcherXamlPrototype.exe)) { throw 'EXE missing' }
          $pri = @(Get-ChildItem .\xaml-src\dist -Filter '*.pri' -File -ErrorAction SilentlyContinue)
          if ($pri.Count -eq 0) { throw 'PRI resource index missing' }
          Write-Host "PRI resource index: $($pri.Name -join ', ')"
          if (!(Test-Path .\xaml-src\dist\resources.pri)) {
            Copy-Item $pri[0].FullName .\xaml-src\dist\resources.pri -Force
            Write-Host "Also created resources.pri compatibility copy."
          }
          $total = (Get-ChildItem .\xaml-src\dist -File | Measure-Object Length -Sum).Sum
          Write-Host "Total output bytes: $total"

      - name: Package prototype
        shell: pwsh
        run: |
          @'
          WinUI 3 minimal launch baseline
          C++ / x64 / Unpackaged / Framework-dependent
          Windows App SDK target: 1.7.9 (1.7.260224002)
          This prototype only opens a window and handles one button click.
          It does not access Genshin Impact registry data.
          '@ | Set-Content -Encoding utf8 .\xaml-src\dist\README-TEST.txt
          $hash = (Get-FileHash .\xaml-src\dist\GenshinSwitcherXamlPrototype.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GenshinSwitcherXamlPrototype.exe" | Set-Content -Encoding ascii .\xaml-src\dist\GenshinSwitcherXamlPrototype.exe.sha256
          Compress-Archive -Path .\xaml-src\dist\* -DestinationPath .\GenshinSwitcher-WinUI3-1.7-Minimal-x64.zip -Force
          Get-Item .\GenshinSwitcher-WinUI3-1.7-Minimal-x64.zip | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinSwitcher-WinUI3-1.7-Minimal-x64
          path: .\GenshinSwitcher-WinUI3-1.7-Minimal-x64.zip
          retention-days: 14
          if-no-files-found: error
